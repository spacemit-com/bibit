[package]
name = "BiBit"
version = "1.0.0-beta.1"
description = "BiBit desktop assistant frontend."
authors = ["BiBit Team"]
license = "MIT"
repository = "https://github.com/spacemit-com/bibit"
edition = "2021"
rust-version = "1.88"
resolver = "2"
autobins = false
default-run = "bibit-gui"

[[bin]]
name = "bibit-gui"
path = "src/main.rs"

[[test]]
name = "fake_acp_agent"
path = "tests/fake_acp_agent.rs"
required-features = ["runtime-test-agent"]

[[test]]
name = "hermes_acp_driver"
path = "tests/hermes_acp_driver.rs"
required-features = ["runtime-test-agent"]

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[features]
default = [
    "tauri/wry",
    "tauri/common-controls-v6",
    "tauri/x11",
    "tauri/protocol-asset",
    "tauri/tray-icon",
    "tauri/test",
    "tauri/custom-protocol",
    "desktop",
]
hardware = ["dep:tauri-plugin-hardware"]
deep-link = ["dep:tauri-plugin-deep-link"]
desktop = [
    "deep-link",
    "hardware",
]
test-tauri = [
    "tauri/wry",
    "tauri/x11",
    "tauri/protocol-asset",
    "tauri/tray-icon",
    "tauri/test",
    "deep-link",
    "hardware",
    "desktop",
]
runtime-test-agent = []
allow-unsigned-plugins = []
demo-runtime = []

[patch.crates-io]
target-lexicon = { path = "../vendor/target-lexicon" }

[build-dependencies]
tauri-build = { version = "2.0.2", features = [] }
serde_json = "1.0"

[dependencies]
agent-client-protocol = { version = "=1.3.0", default-features = false }
dirs = "6.0.0"
async-trait = "0.1"
env = "1.0.1"
fix-path-env = { git = "https://github.com/tauri-apps/fix-path-env-rs" }
flate2 = "1.0"
futures-util = "0.3.31"
hex = "0.4"
hmac = "0.12"
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
http-body-util = "0.1"
tokio-tungstenite = { version = "=0.28.0", features = ["native-tls"] }
tokio-stream = "0.1"
jan-utils = { path = "./utils" }
libloading = "0.8.7"
log = "0.4"
rand = "0.8"
rmcp = { version = "0.8.5", features = [
    "client",
    "transport-sse-client",
    "transport-sse-client-reqwest",
    "transport-streamable-http-client",
    "transport-streamable-http-client-reqwest",
    "transport-child-process",
    "tower",
    "reqwest",
] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9.34"
semver = "1.0"
sha2 = "0.10"
tar = "0.4"
zip = "0.6"
tauri-plugin-deep-link = { version = "2", optional = true }
tauri-plugin-hardware = { path = "./plugins/tauri-plugin-hardware", optional = true }
tauri-plugin-llamacpp = { path = "./plugins/tauri-plugin-llamacpp" }
tauri-plugin-vector-db = { path = "./plugins/tauri-plugin-vector-db" }
tauri-plugin-rag = { path = "./plugins/tauri-plugin-rag" }
tauri-plugin-websearch = { path = "./plugins/tauri-plugin-websearch" }
# `default-features = false` drops the plugin's default `rustls-tls` (bundled
# Mozilla roots) so `native-tls` reads the OS trust store instead. Other
# features re-list the plugin's defaults so behaviour is otherwise unchanged.
tauri-plugin-http = { version = "2", default-features = false, features = [
  "native-tls",
  "http2",
  "charset",
  "cookies",
  "unsafe-headers",
] }
tauri-plugin-log = "2.0.0-rc"
tauri-plugin-opener = "2.2.7"
tauri-plugin-os = "2.2.1"
tauri-plugin-shell = "2.2.0"
tauri-plugin-store = "2"
thiserror = "2.0.12"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7.14"
url = "2.5"
uuid = { version = "1.7", features = ["v4"] }
rfd = { version = "0.15.4", default-features = false, features = [
  "async-std",
  "xdg-portal",
] }
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2.1", features = ["rand_core"] }
futures = "0.3"
hostname = "0.4"
base64 = "0.22"
glob = "0.3"
clap = { version = "4", features = ["derive"] }
keyring = { version = "3", features = [
    "sync-secret-service",
    "crypto-rust",
] }
aes-gcm = "0.10"
machine-uid = "0.5"
nix = { version = "=0.30.1", features = ["signal", "process", "resource", "fs", "user"] }
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }
gtk = "0.18"
webkit2gtk = "2.0"
ksni = { version = "=0.3.6", default-features = false, features = ["async-io"] }
reqwest = { version = "0.12", features = ["json", "blocking", "stream", "multipart", "native-tls"] }
once_cell = "1.18"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }

[dependencies.tauri]
version = "2.8.5"
default-features = false
features = ["protocol-asset", "test"]

[dev-dependencies]
tempfile = "3.20.0"

# Release profile optimizations for minimal binary size
[profile.release]
opt-level = "z"     # Optimize for size
lto = "fat"         # Aggressive Link Time Optimization
strip = "symbols"   # Strip debug symbols for smaller binary
codegen-units = 1   # Reduce parallel codegen for better optimization
panic = "unwind"     # Unwind on panic, allows catching library panics
overflow-checks = false  # Disable overflow checks for size
debug = false       # No debug info
debug-assertions = false  # No debug assertions
incremental = false # Disable incremental compilation for release
rpath = false       # Don't include rpath
